/**:
  ros__parameters:
    image_topic: image_raw
    detection_topic: detection
    camera_info_topic: camera_info
    controller_topic: /controller_state

    # 按图像时间戳计算 alpha = 1 - exp(-dt / tau)，中心滤波后重新计算单位视线。
    # tau=1s 时理想阶跃约 3s 达到 95%；运行时改参会重置滤波器。
    center_filter:
      enabled: true
      tau_x_s: 1.0
      tau_y_s: 1.0
      reset_gap_s: 2.0

    # target_mode=0 使用前哨站配置，其他现有模式使用基地配置。
    # 两套参数当前保持一致，可在完成前哨站采样后分别调整。
    profiles:
      names: [outpost, base]
      outpost:
        modes: [0]
        ambiguity_margin: 0.05
        center:
          # 可运行时切换：brightness_weighted / contour_centroid / enclosing_circle /
          # circle_fit / ellipse_fit；退化时回退到最小外接圆中心并计入诊断。
          method: brightness_weighted
        segmentation:
          min_hue: 35.0
          max_hue: 95.0
          min_saturation: 45.0
          min_value: 100.0
          min_green_excess: 25.0
        geometry:
          min_radius_px: 13.0
          max_radius_px: 19.0
          min_circularity: 0.7
          max_aspect_ratio: 1.55
          min_fill_ratio: 0.45
        photometry:
          min_inner_brightness: 100.0
          min_contrast_ratio: 1.5
        mask_cleanup:
          close_kernel_size: 3
          close_iterations: 1
          open_kernel_size: 0
          open_iterations: 1
          fill_holes: true

      base:
        modes: [1, 2, 3, 4]
        ambiguity_margin: 0.05
        center:
          method: brightness_weighted
        segmentation:
          min_hue: 35.0
          max_hue: 95.0
          min_saturation: 45.0
          min_value: 100.0
          min_green_excess: 25.0
        geometry:
          min_radius_px: 13.0
          max_radius_px: 19.0
          min_circularity: 0.7
          max_aspect_ratio: 1.55
          min_fill_ratio: 0.45
        photometry:
          min_inner_brightness: 100.0
          min_contrast_ratio: 1.5
        mask_cleanup:
          close_kernel_size: 3
          close_iterations: 1
          open_kernel_size: 0
          open_iterations: 1
          fill_holes: true
