/**:
  ros__parameters:
    model_path: package://dart_bringup/models/pcd/base_pnx_5mm.pcd
    # 初值较准时直接GICP；仅标定时需要扩大收敛范围才启用NDT。
    coarse_enabled: true
    dof: xyzyaw
    min_input_points: 150
    validation:
      min_correspondences: 100
    output:
      # 三次通过验收且位置一致的结果才自动保存；每次计数至少间隔0.6s。
      save_once: true
      directory: /home/pnx/pnx/dart_vision/results/lidar
      bag_name: ""
