/**:
  ros__parameters:
    profile: offline

    topics:
      input: lidar/offline/accumulated
      observation: lidar/observation
      aligned: lidar/offline/aligned
      candidate_aligned: lidar/offline/candidate_aligned

    models:
      base_path: "/home/pnx/pnx/dart_vision/src/dart_bringup/models/pcd/base_pnx_5mm.pcd"
      module_path: "/home/pnx/pnx/dart_vision/src/dart_bringup/models/pcd/armor_pnx_5mm.pcd"

    frames:
      reference: base_nominal_link
      base: base_link
      rail: rail_origin_link

    initial_guess:
      source: tf
      lookup_timeout_s: 0.1

    base:
      coarse:
        enabled: true
        ndt:
          voxel_leaf_size_m: [0.10, 0.05]
          resolution_m: [0.12, 0.06]
          step_size_m: [0.10, 0.05]
          transformation_epsilon: [0.001, 0.0005]
          max_iterations: [60, 40]
      fine:
        gicp:
          voxel_leaf_size_m: [0.03, 0.015]
          max_correspondence_distance_m: [0.12, 0.04]
          transformation_epsilon: [0.000001, 0.000001]
          fitness_epsilon: [0.000001, 0.000001]
          max_iterations: [40, 60]
      constraints:
        dof: six_dof
      validation:
        correspondence_distance_m: 0.04
        max_rmse_m: 0.025
        min_overlap_ratio: 0.35
        min_correspondences: 1000
        enforce_initial_deviation_limits: false
        max_translation_from_initial_m: 0.50
        max_yaw_from_initial_rad: 0.18
        reject_if_search_boundary_hit: true
        boundary_ratio: 0.98
      runtime:
        max_total_time_ms: 5000.0
        min_input_points: 1000

    module:
      enabled: true
      min_position_m: 0.0
      max_position_m: 1.2
      coarse_step_m: 0.005
      fine_step_m: 0.0005
      fine_half_window_m: 0.02
      max_correspondence_distance_m: 0.025
      max_rmse_m: 0.015
      min_overlap_ratio: 0.30
      min_correspondences: 10
      roi_padding_m: [0.03, 0.03, 0.03]
      max_position_jump_m: 0.0

    debug:
      publish_aligned_cloud: true
      # 完成配准但未通过质量验收时，也发布候选结果供RViz诊断。
      publish_candidate_aligned_cloud: true

    # 每次输入都会按本机时间生成独立文件，不覆盖default.yaml或历史记录。
    output:
      enabled: true
      directory: "/home/pnx/pnx/dart_vision/src/dart_bringup/config/site/"
      filename_prefix: lidar_localization
      bag_name: "CustomMsg_20hz_1"
