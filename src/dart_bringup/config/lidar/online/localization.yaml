/**:
  ros__parameters:
    profile: online

    topics:
      input: lidar/debug/accumulated
      observation: lidar/observation
      aligned: lidar/debug/aligned
      candidate_aligned: lidar/debug/candidate_aligned

    # base模型坐标系为base_link；module模型坐标系为零位的
    # dart_detection_module_link，且X轴必须与滑轨轴一致。
    models:
      base_path: ""
      module_path: ""

    frames:
      reference: base_link
      base: base_link
      rail: rail_origin_link

    initial_guess:
      source: tf
      lookup_timeout_s: 0.1

    base:
      coarse:
        enabled: false
        ndt:
          voxel_leaf_size_m: [0.10, 0.05]
          resolution_m: [0.12, 0.06]
          step_size_m: [0.10, 0.05]
          transformation_epsilon: [0.001, 0.0005]
          max_iterations: [60, 40]
      fine:
        gicp:
          voxel_leaf_size_m: [0.03, 0.02]
          max_correspondence_distance_m: [0.08, 0.05]
          transformation_epsilon: [0.00001, 0.00001]
          fitness_epsilon: [0.00001, 0.00001]
          max_iterations: [12, 8]
      constraints:
        dof: six_dof
      validation:
        correspondence_distance_m: 0.05
        max_rmse_m: 0.025
        min_overlap_ratio: 0.35
        min_correspondences: 500
        # false时只做技术质量验收；与场地初值的偏差交给target_estimation。
        enforce_initial_deviation_limits: false
        max_translation_from_initial_m: 0.08
        max_yaw_from_initial_rad: 0.035
        reject_if_search_boundary_hit: true
        boundary_ratio: 0.98
      runtime:
        max_total_time_ms: 250.0
        min_input_points: 500

    module:
      enabled: true
      min_position_m: 0.0
      max_position_m: 1.2
      coarse_step_m: 0.01
      fine_step_m: 0.001
      fine_half_window_m: 0.02
      max_correspondence_distance_m: 0.025
      max_rmse_m: 0.015
      min_overlap_ratio: 0.30
      min_correspondences: 10
      roi_padding_m: [0.03, 0.03, 0.03]
      # 0表示不做跨测量跳变限制，由target_estimation判断语义偏差。
      max_position_jump_m: 0.0

    debug:
      publish_aligned_cloud: true
      publish_candidate_aligned_cloud: false

    output:
      enabled: false
      directory: "/home/pnx/pnx/dart_vision/src/dart_bringup/config/site"
      filename_prefix: lidar_localization
      bag_name: ""
