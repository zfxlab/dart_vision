/**:
  ros__parameters:
    top_detection_topic: /top_camera/detection
    bottom_detection_topic: /bottom_camera/detection
    result_topic: /stereo_target
    top_frame_id: top_camera_optical_frame
    bottom_frame_id: bottom_camera_optical_frame
    # 两个光心和视线均通过 TF 转换到此坐标系，再进行三角测量。
    reference_frame: launcher_frame

    max_pair_delta_s: 0.04
    queue_size: 10

    # 三维视线的交会锐角；min_depth_m 表示沿原始三维射线的距离。
    min_ray_angle_deg: 0.05
    min_depth_m: 0.5
    # 估计点到任一相机光心的最大空间距离。
    max_camera_range_m: 30.0
    # 两条空间视线最近点的间距；需用实测数据确认阈值。
    max_ray_gap_m: 0.1
