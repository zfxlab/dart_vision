/**:
  ros__parameters:
    left_detection_topic: /left_camera/detection
    right_detection_topic: /right_camera/detection
    left_camera_info_topic: /left_camera/camera_info
    right_camera_info_topic: /right_camera/camera_info
    result_topic: stereo_target
    left_frame_id: left_camera_optical_frame
    right_frame_id: right_camera_optical_frame
    # 平行双目水平模型的输出坐标系：x 前、y 左、z=0。
    reference_frame: stereo_camera_center_link

    max_pair_delta_s: 0.03
    queue_size: 10

    baseline_m: 0.3
    min_normalized_disparity: 0.000001
    min_distance_m: 0.5
    max_distance_m: 30.0
    max_vertical_residual: 0.002
