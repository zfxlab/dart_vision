/**:
  ros__parameters:
    stereo_topic: /stereo_target
    controller_topic: /controller_state
    command_topic: /aim_command
    # 原点在离轨点，轴与 launcher_frame 对齐；底座水平时 z 向上。
    # 不使用带发射俯仰角的 dart_release_link。
    reference_frame: ballistic_reference_frame
    target_timeout_s: 0.2
    controller_timeout_s: 0.3
    max_ray_gap_m: 0.1
    supported_target_modes: [0, 1, 2, 3, 4]

    # 每个模型可选择多个 target_mode，同一个 mode 只能属于一个模型。
    # 系数顺序为 [a, b, c]，直接输出 a*x^2 + b*x + c，而非计算残差。
    # yaw 的 x 为几何 yaw；distance 的 x 为几何距离；当前均为恒等映射。
    fitting:
      model_names: [outpost, fixed, moving]
      models:
        outpost:
          modes: [0]
          yaw_coefficients: [0.0, 1.0, 0.0]
          distance_coefficients: [0.0, 1.0, 0.0]
        fixed:
          modes: [1, 2]
          yaw_coefficients: [0.0, 1.0, 0.0]
          distance_coefficients: [0.0, 1.0, 0.0]
        moving:
          modes: [3, 4]
          yaw_coefficients: [0.0, 1.0, 0.0]
          distance_coefficients: [0.0, 1.0, 0.0]
