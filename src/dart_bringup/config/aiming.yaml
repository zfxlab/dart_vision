/**:
  ros__parameters:
    stereo_topic: /camera/stereo_target
    controller_topic: /controller_state
    command_topic: /aim_command
    enable_visualization: true
    visualization_topic: /aiming/markers
    marker_lifetime_s: 0.3
    target_marker_radius_m: 0.08
    marker_line_width_m: 0.02
    # 输出参考系：x 前、y 左、z 上。输入按 header.frame_id 通过 TF 转换。
    reference_frame: stereo_camera_center_link
    target_timeout_s: 0.2
    controller_timeout_s: 0.3
    confirmation_frames: 3
    max_yaw_step_rad: 0.02
    max_distance_step_m: 0.3
    supported_target_modes: [0, 1, 2, 3, 4]
