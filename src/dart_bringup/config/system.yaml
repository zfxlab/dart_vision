lidar:
  ros__parameters:
    fixed_frame: dart_base_link
    base_window: 0.8
    module_window: 0.12
    initialization_min_span: 0.5
    initialization_timeout: 3.0
    base_confirmations: 2
    base_consistency: 0.03
    base_max_shift: 0.3
    base_threshold: 0.08
    base_min_support: 0.65
    base_min_points: 80
    module_threshold: 0.035
    module_min_points: 12
    module_min_support: 0.55
    module_ambiguity: 0.002
    module_step: 0.01
    background_distance: 0.025
    # Provisional ROI in livox_frame. Must match actual door geometry and sensor range.
    near_lower: [0.3, -0.6, -0.6]
    near_upper: [2.0, 0.6, 0.6]
    min_near_points: 15
    min_far_points: 10
    timestamp_source: receive

target_estimation:
  ros__parameters:
    fixed_frame: dart_base_link
    # User-selected base aim point in base_link; replace with measured definition.
    base_aim_point: [0.0, 0.0, 0.91]
    center_q: 0.28
    open_confirm: 0.25
    close_confirm: 0.2
    visibility_timeout: 0.3
    observation_timeout: 0.25
    reference_timeout: 1.0
    ray_residual: 0.06
    sensor_disagreement: 0.10

aiming:
  ros__parameters:
    fixed_frame: dart_base_link
    launcher_frame: launcher_frame
    controller_timeout: 0.25
    estimate_timeout: 0.25
    tf_timeout: 0.25
    light_timeout: 0.25
    allow_acquire: true
