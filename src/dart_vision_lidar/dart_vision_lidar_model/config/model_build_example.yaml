schema_version: 2

# This is an ordinary yaml-cpp file, not a ROS parameter file. Paths are
# resolved relative to this file. Each PLY or STL mesh must already use its
# target template frame; scale_to_m is the only coordinate conversion applied.
models:
  - name: base_open_fixed
    input_mesh: ../models/raw/base_pnx.ply
    output_pcd: ../models/processed/base_open_fixed.pcd
    scale_to_m: 0.001
    sample_count: 150000
    random_seed: 7001
    voxel_leaf_m: 0.005
    overwrite: false

  - name: base_closed_fixed
    input_mesh: ../models/raw/base_pnx.ply
    output_pcd: ../models/processed/base_closed_fixed.pcd
    scale_to_m: 0.001
    sample_count: 150000
    random_seed: 7002
    voxel_leaf_m: 0.005
    overwrite: false

  - name: moving_armor
    input_mesh: ../models/raw/armor_pnx.ply
    output_pcd: ../models/processed/moving_armor.pcd
    scale_to_m: 0.001
    sample_count: 60000
    random_seed: 7003
    voxel_leaf_m: 0.003
    overwrite: false
